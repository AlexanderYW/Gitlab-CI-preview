name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Package VSIX
        run: bun run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-ci-preview-vsix
          path: gitlab-ci-preview.vsix
          if-no-files-found: error
