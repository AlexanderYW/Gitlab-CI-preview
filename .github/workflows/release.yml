name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Never cancel an in-progress release: a cancelled run mid-publish could leave
# a tag/Release published without the marketplace extensions uploaded.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # semantic-release needs full history and all tags to compute the next
      # version from conventional commits since the last release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Gates are duplicated from CI so a broken main can never publish a
      # release (e.g. if a fix was pushed directly to main without a PR).
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Semantic release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
